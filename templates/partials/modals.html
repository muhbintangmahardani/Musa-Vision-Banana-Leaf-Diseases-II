<!-- Lightbox Modal Fullscreen -->
<div id="lightboxModal" class="hidden fixed inset-0 z-[150] bg-black/90 backdrop-blur-md flex items-center justify-center p-4 pt-24 sm:pt-28 pb-8 overflow-y-auto">
  <div class="relative max-w-4xl w-full bg-[#163C24] rounded-3xl overflow-hidden border border-white/10 shadow-xl flex flex-col">
    <div class="flex items-center justify-between p-4 border-b border-white/10 text-white">
      <span class="text-xs font-semibold" id="lightboxCaption">Pratinjau Citra Resolusi Penuh</span>
      <div class="flex items-center gap-2">
        <div class="flex items-center gap-1 bg-white/10 p-1 rounded-full text-xs">
          <button type="button" id="lbTabAnnotated" onclick="switchLightboxTab('annotated')" class="px-3 py-1 rounded-full text-white active">YOLO26n</button>
          <button type="button" id="lbTabClahe" onclick="switchLightboxTab('clahe')" class="px-3 py-1 rounded-full text-white/80 hover:text-white">CLAHE</button>
          <button type="button" id="lbTabOrig" onclick="switchLightboxTab('orig')" class="px-3 py-1 rounded-full text-white/80 hover:text-white">Asli</button>
        </div>
        <button type="button" onclick="downloadDetectionResult()" class="p-1.5 rounded-full hover:bg-white/10 text-white" title="Unduh Gambar" aria-label="Unduh Gambar">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
            <polyline points="7 10 12 15 17 10"></polyline>
            <line x1="12" y1="15" x2="12" y2="3"></line>
          </svg>
        </button>
        <button type="button" onclick="closeLightbox()" class="p-1.5 rounded-full hover:bg-white/10 text-white text-xl leading-none" title="Tutup" aria-label="Tutup Lightbox">
          &times;
        </button>
      </div>
    </div>
    <div class="p-4 flex items-center justify-center bg-black/60 max-h-[75vh] overflow-hidden">
      <img id="lightboxImg" src="" alt="Zoom Citra" class="max-h-[70vh] w-auto max-w-full object-contain rounded-xl" />
    </div>
  </div>
</div>

<!-- Modal Detail Riwayat (IndexedDB Item Viewer) -->
<div id="historyDetailModal" class="hidden fixed inset-0 z-[150] bg-black/80 backdrop-blur-md flex items-center justify-center p-4 pt-24 sm:pt-28 pb-8 overflow-y-auto">
  <div class="relative max-w-xl w-full bg-white rounded-2xl overflow-hidden border border-[#E8EAE6] shadow-lg flex flex-col">
    <div class="flex items-center justify-between p-5 border-b border-[#E8EAE6] bg-[#F6F7F4]">
      <div>
        <h3 id="hdmTitle" class="text-lg font-bold text-[#111812]">Detail Riwayat Pengujian</h3>
        <p id="hdmSci" class="text-xs text-[#4B524C] italic">Musa spp.</p>
      </div>
      <button type="button" onclick="closeHistoryDetailModal()" class="w-8 h-8 rounded-full bg-white border border-[#E8EAE6] text-[#4B524C] hover:text-[#111812] flex items-center justify-center transition" aria-label="Tutup Modal">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
      </button>
    </div>

    <div class="p-5 space-y-4 text-xs text-[#111812]">
      <div class="flex gap-4 items-center bg-[#F6F7F4] p-3.5 rounded-2xl border border-[#E8EAE6]">
        <img id="hdmImg" src="" alt="Thumbnail" class="w-20 h-20 object-cover rounded-xl border border-[#E8EAE6] bg-white" />
        <div class="space-y-1">
          <div class="font-mono text-xs text-[#4B524C]" id="hdmTime">-</div>
          <div class="font-bold text-sm text-[#111812]" id="hdmFile">-</div>
          <div class="font-semibold text-[#2F6B43]" id="hdmSeverity">-</div>
        </div>
      </div>

      <div class="space-y-1">
        <span class="font-bold block text-[#111812]">Statistik Deteksi:</span>
        <p id="hdmCounts" class="text-[#4B524C] bg-[#F6F7F4] p-2.5 rounded-xl border border-[#E8EAE6] font-mono">-</p>
      </div>

      <div class="space-y-1">
        <span class="font-bold block text-[#111812]">Panduan Fungisida (FRAC):</span>
        <p id="hdmFrac" class="text-[#4B524C] bg-[#F6F7F4] p-2.5 rounded-xl border border-[#E8EAE6] leading-relaxed">-</p>
      </div>

      <div class="space-y-1">
        <span class="font-bold block text-[#111812]">Catatan Latensi Komputasi:</span>
        <p id="hdmLatency" class="text-[#4B524C] bg-[#F6F7F4] p-2.5 rounded-xl border border-[#E8EAE6] font-mono text-xs">-</p>
      </div>
    </div>

    <div class="p-4 border-t border-[#E8EAE6] bg-[#F6F7F4] flex justify-end">
      <button type="button" onclick="closeHistoryDetailModal()" class="px-5 py-2 rounded-full bg-white border border-[#E8EAE6] text-[#111812] font-semibold text-xs hover:bg-slate-100 transition">
        Tutup
      </button>
    </div>
  </div>
</div>
